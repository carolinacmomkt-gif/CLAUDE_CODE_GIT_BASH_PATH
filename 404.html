<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada · Organiza SM</title>
  <style>
    :root { --brown: #3B2A20; --brown-2: #6B4E3D; --caramel-ink: #7E5B40; --cream: #FBF8F3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 32px 20px; background: var(--cream); color: var(--brown);
      font: 400 17px/1.6 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .brand { font-weight: 700; font-size: .8rem; letter-spacing: .3em; margin-bottom: 28px; }
    h1 { font: 300 2.2rem/1.15 Georgia, "Times New Roman", serif; margin: 0 0 12px; }
    p { color: var(--brown-2); margin: 0 0 28px; }
    a {
      display: inline-block; background: var(--brown); color: var(--cream); text-decoration: none;
      font-weight: 700; padding: 15px 26px; border-radius: 999px;
    }
    a:focus-visible { outline: 3px solid var(--caramel-ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ORGANIZA SM</div>
    <h1>Essa página não existe.</h1>
    <p>Mas a sua central está te esperando logo ali.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
