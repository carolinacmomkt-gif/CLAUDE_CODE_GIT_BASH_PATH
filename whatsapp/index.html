  <script>
    (function () {
      // Leva UTMs e IDs de clique do anúncio para os links do site
      var params = new URLSearchParams(location.search);
      document.querySelectorAll("[data-site]").forEach(function (a) {
        try {
          var url = new URL(a.getAttribute("href"), location.href);
          params.forEach(function (v, k) {
            if (/^(utm_|fbclid$|gclid$|ttclid$|src$|sck$)/.test(k)) url.searchParams.set(k, v);
          });
          a.href = url.toString();
        } catch (e) {}
      });
      // Evento de contato no pixel quando a pessoa clica para chamar no WhatsApp
      var wa = document.getElementById("wa");
      if (wa) wa.addEventListener("click", function () {
        if (window.fbq) window.fbq("track", "Contact", { content_name: "WhatsApp Carol" });
      });
    })();
  </script>
